<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TARA</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --bubble-user: #2563eb;
      --bubble-tara: #1e293b;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --border: #1f293d;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    /* Minimal Center Header */
    header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--text);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    /* Chat Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
    }
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user {
      align-self: flex-end;
    }
    .msg.user .bubble {
      background: var(--bubble-user);
      color: #ffffff;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
    }
    .msg.tara {
      align-self: flex-start;
    }
    .msg.tara .bubble {
      background: var(--bubble-tara);
      color: var(--text);
      border-radius: 18px 18px 18px 4px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .bubble {
      padding: 14px 20px;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }
    /* Footer & Input Box */
    footer {
      padding: 16px 20px 20px;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-box {
      max-width: 840px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 6px 8px 6px 18px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      outline: none;
      padding: 8px 0;
    }
    #chat-input::placeholder {
      color: var(--text-muted);
    }
    /* Voice Mic Button */
    .btn-mic {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 19px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .btn-mic:hover {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }
    .btn-mic.active {
      color: #ffffff;
      background: var(--danger);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.7);
      animation: pulseMic 1.2s infinite;
    }
    @keyframes pulseMic {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    /* Send Button */
    #btn-send {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    #btn-send:hover {
      background: #7dd3fc;
      transform: scale(1.05);
    }
    #btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    @media (max-width: 640px) {
      .brand { font-size: 19px; }
      .bubble { font-size: 14px; padding: 12px 16px; }
      #chat-container { padding: 16px 12px; }
      footer { padding: 12px 12px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="status-dot"></span>
      TARA
    </div>
  </header>

  <div id="chat-container">
    <div class="msg tara">
      <div class="bubble">Hello. I am TARA. How may I assist you today?</div>
    </div>
  </div>

  <footer>
    <form class="input-box" onsubmit="handleSend(event)">
      <input type="text" id="chat-input" placeholder="Message TARA..." autocomplete="off" />
      <button type="button" id="btn-mic" class="btn-mic" onclick="toggleVoice()" title="Voice input">🎙️</button>
      <button type="submit" id="btn-send">➔</button>
    </form>
  </footer>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("btn-send");
    const micBtn = document.getElementById("btn-mic");

    function appendMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    async function sendChatRequest(promptText) {
      const endpoints = [];
      const origin = window.location.origin;

      // 1. Prioritize relative production chat endpoint
      if (origin && origin !== "null" && !origin.startsWith("file:")) {
        endpoints.push(`${origin}/v1/chat`);
        endpoints.push(`${origin}/api/v1/chat`);
      }

      // 2. Direct live Hugging Face production backend
      endpoints.push("https://manjukp6-tara.hf.space/v1/chat");
      endpoints.push("https://manjukp6-tara.hf.space/api/v1/chat");

      // 3. Localhost endpoints for local testing
      endpoints.push("http://127.0.0.1:7860/v1/chat");
      endpoints.push("http://127.0.0.1:8000/api/v1/chat");

      const payload = {
        message: promptText,
        prompt: promptText,
        input: promptText
      };

      let lastError = null;

      for (const url of endpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timer);

          if (res.ok) {
            const data = await res.json();
            return (data.response || (data.data && data.data.response) || data.text || JSON.stringify(data));
          } else {
            const errData = await res.json().catch(() => ({}));
            lastError = new Error(`Server returned HTTP ${res.status}: ${errData.error || errData.detail || "Error"}`);
          }
        } catch (e) {
          lastError = e;
        }
      }

      throw new Error(`Real TARA runtime unreachable: ${lastError ? lastError.message : "Service Unavailable"}`);
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      chatInput.value = "";
      sendBtn.disabled = true;

      try {
        const response = await sendChatRequest(text);
        appendMessage("tara", response);
        speakIfEnabled(response);
      } catch (err) {
        appendMessage("tara", `[TARA Runtime Notice]: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    // -------------------------------------------------------------
    // Voice Engine (Speech-to-Text & Text-to-Speech)
    // -------------------------------------------------------------
    let recognition = null;
    let isListening = false;
    let voiceActive = false;

    function initVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      try {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "en-US";

        recognition.onstart = () => {
          isListening = true;
          micBtn.classList.add("active");
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          chatInput.value = transcript;
          handleSend();
        };

        recognition.onerror = () => {
          isListening = false;
          micBtn.classList.remove("active");
        };

        recognition.onend = () => {
          isListening = false;
          micBtn.classList.remove("active");
        };
      } catch (e) {
        console.warn("Voice init:", e);
      }
    }

    function toggleVoice() {
      if (!recognition) {
        initVoice();
      }
      if (!recognition) {
        alert("Speech recognition is not supported in this browser.");
        return;
      }
      voiceActive = true;
      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    }

    function speakIfEnabled(text) {
      if (!voiceActive || !window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    initVoice();
  </script>
</body>
</html>
