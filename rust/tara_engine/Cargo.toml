[package]
name = "tara_engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "TARA AI — Neural model inference engine: SafeTensors loader, GQA transformer, tokenizer, generation pipeline"
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
rand = "0.8"
half = { version = "2.3", features = ["std"] }
byteorder = "1.5"
log = "0.4"
flate2 = "1.0"
rayon = "1.10"

# Shared workspace crate
tara_core = { path = "../tara_core" }

[features]
default = []
