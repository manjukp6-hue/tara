# Render Blueprint: TARA AI Core Production Web Service
services:
  - type: web
    name: tara-ai-core
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: USER_COMPUTE_COST
        value: "0.0"
      - key: ENFORCE_ZERO_USER_COST
        value: "true"
