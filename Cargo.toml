[workspace]
resolver = "2"
members = [
    "rust/tara_core",
    "rust/tara_engine",
    "rust/tara_server",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["TARA Core Team"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

