[package]
name = "tara_standalone_downloader"
version = "1.0.0"
edition = "2021"
authors = ["TARA Downloader Team"]
description = "Standalone Dataset Downloader with Dynamic Integrity and Permissive License Verification"
license = "Apache-2.0"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
parquet = { version = "53.0", default-features = false, features = ["arrow", "snap"] }
arrow = { version = "53.0", default-features = false, features = ["json"] }
arrow-json = "53.0"
