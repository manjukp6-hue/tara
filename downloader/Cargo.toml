[package]
name = "downloader"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "downloader"
path = "download_engine.rs"

[[bin]]
name = "downloader"
path = "downloader.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
flate2 = "1.0"
